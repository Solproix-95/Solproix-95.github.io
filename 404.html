<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata — Nexus</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.png">
<meta name="theme-color" content="#07070a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<link rel="preload" href="/font/geist.woff2" as="font" type="font/woff2" crossorigin>
<script>
  try { const t = localStorage.getItem("nexus-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url(/font/bricolage.woff2) format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Geist"; src: url(/font/geist.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/font/geist-mono.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Instrument Serif"; src: url(/font/instrument-serif-italic.woff2) format("woff2"); font-style: italic; font-weight: 400; font-display: swap; }
:root {
  --notte: #07070a; --pannello: #0d0d11; --linea: #1d1c23; --testo: #ece9e3; --tenue: #8e8b95;
  --iri-a: #ff5f86; --iri-b: #ffb46a; --iri-c: #6fd3ff; --vetro: rgba(13, 13, 17, 0.72);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --notte: #f3f2ee; --pannello: #fbfaf7; --linea: #dfddd6; --testo: #121116; --tenue: #65636b;
    --iri-a: #e0315f; --iri-b: #d77b16; --iri-c: #0a86b8; --vetro: rgba(243, 242, 238, 0.78);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --notte: #f3f2ee; --pannello: #fbfaf7; --linea: #dfddd6; --testo: #121116; --tenue: #65636b;
  --iri-a: #e0315f; --iri-b: #d77b16; --iri-c: #0a86b8; --vetro: rgba(243, 242, 238, 0.78);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--notte); color: var(--testo); font-family: "Geist", "Segoe UI", system-ui, sans-serif;
  font-size: 16.5px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--iri-c); outline-offset: 3px; border-radius: 4px; }
.gabbia { max-width: 760px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.testata { position: sticky; top: 0; z-index: 2; background: var(--vetro); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--linea); }
.testata .gabbia { display: flex; align-items: center; justify-content: space-between; height: 60px; max-width: 1180px; }
.marchio { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 19px; }
.marchio img { width: 28px; height: 28px; border-radius: 8px; }
.etichetta { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tenue); }
.indietro { text-decoration: none; }
.indietro:hover { color: var(--testo); }
h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; text-wrap: balance; letter-spacing: -0.02em; }
h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1; font-weight: 800; margin: 72px 0 16px; letter-spacing: -0.035em; }
h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
h2 { font-size: 24px; line-height: 1.2; margin: 44px 0 10px; }
p, li { color: var(--tenue); }
strong { color: var(--testo); font-weight: 600; }
ul { padding-left: 20px; }
li { margin-bottom: 6px; }
.riassunto { margin: 32px 0 8px; padding: 24px 26px; border: 1px solid var(--linea); background: var(--pannello); }
.riassunto p { margin: 0 0 6px; }
.riassunto ul { margin: 0; }
.da-compilare { background: color-mix(in srgb, var(--iri-a) 18%, transparent); color: var(--testo); padding: 0 4px; }
footer { margin-top: 80px; border-top: 1px solid var(--linea); }
footer .gabbia { padding-block: 28px 44px; }
main.vuoto { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; padding-block: 80px; }
main.vuoto h1 { margin: 0; }
.anello { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; border: 2.5px solid transparent;
  background: linear-gradient(var(--notte), var(--notte)) padding-box, linear-gradient(135deg, var(--iri-a), var(--iri-b), var(--iri-c)) border-box;
  box-shadow: 0 0 34px -4px var(--iri-b); }
.tasto { display: inline-block; margin-top: 10px; padding: 14px 22px; border: 1px solid var(--testo); background: var(--testo); color: var(--notte);
  font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
</style>
</head>
<body>
<header class="testata">
  <div class="gabbia">
    <a class="marchio" href="/"><img src="/img/logo.webp" width="28" height="28" alt="">Nexus</a>
    <a class="etichetta indietro" href="/">← Torna al sito</a>
  </div>
</header>
<main class="gabbia vuoto">
  <div class="anello" aria-hidden="true"></div>
  <span class="etichetta">Errore 404</span>
  <h1>Questa pagina <em>non c'è.</em></h1>
  <p>Forse il link è sbagliato o la pagina è stata spostata.</p>
  <p><a class="tasto" href="/">Vai alla pagina di Nexus</a></p>
</main>
</body>
</html>
